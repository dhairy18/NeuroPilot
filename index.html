<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="NeuroPilot — your AI-powered focus companion for ADHD. Stay on track with a friendly avatar that keeps you accountable.">
  <title>NeuroPilot — Your Focus Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ===== MAIN CONTAINER ===== -->
  <main id="app" class="app-container">

    <!-- Small label above the orb -->
    <p id="status-label" class="status-label">Ready when you are</p>

    <!-- ===== THE AVATAR ORB ===== -->
    <div id="orb-wrapper" class="orb-wrapper">
      <!-- Glow layer that sits behind the orb -->
      <div class="orb-glow"></div>
      <!-- The main orb with swirling gradient -->
      <div id="orb" class="orb">
        <div class="orb-inner"></div>
      </div>
      <!-- Orbiting ring -->
      <div class="orb-ring"></div>
    </div>

    <!-- App name -->
    <h1 id="app-title" class="app-title">NeuroPilot</h1>
    <p class="app-subtitle">Your AI focus companion</p>

    <!-- ===== TASK INPUT ===== -->
    <div id="input-area" class="input-area">
      <input type="text" id="task-input" class="task-input" placeholder="What are you working on today?"
        autocomplete="off" maxlength="120">
      <button id="start-btn" class="start-btn" disabled>
        Let's go
      </button>
    </div>

  </main>

  <script src="app.js"></script>
</body>

</html>
